{% extends "base.html" %}

{% block content %}

<h1>Catálogo</h1>
<h2>Nombre: {{nombre}}</h2>
<h3>Listado productos</h3>
<ul>
    {% for product in lista_products%}
    <li>
        <strong>
            <a href="{{ url_for('producto', idProducto=loop.index-1) }}">{{product.nombre}}</a></strong>
        {{product.precio}}€
        {% if product.disponible %}
        <span style="color:green">En stock</span>
        {% else %}
        <span style="color:red">Agotado</span>
        {% endif %}
    </li>
    {% endfor %}
</ul>
{% endblock %}
